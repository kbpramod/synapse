[project]
name = "forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "K B Pramod", email = "kbpramod3@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "playwright>=1.62.0",
    "uvicorn>=0.52.4",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pytest>=8.0.0",
    "pytest-playwright>=0.5.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
forge = "forge:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "deepeval>=4.2.0",
    "pytest>=9.1.1",
]
